<mat-toolbar class="header">
  <a routerLink="/" class="brand">
    <mat-icon>agriculture</mat-icon>
    <span>Ημερολόγιο Αγρού</span>
  </a>

  @if (isFarmer()) {
    <nav class="nav">
      <a matButton routerLink="/parcels" routerLinkActive="active">Αγροτεμάχια</a>
      <a matButton routerLink="/crops" routerLinkActive="active">Καλλιέργειες</a>
      <a matButton routerLink="/activities" routerLinkActive="active">Ημερολόγιο</a>
    </nav>
  }

  @if (isAdmin()) {
    <nav class="nav">
      <a matButton routerLink="/admin/farmers" routerLinkActive="active">Αγρότες</a>
    </nav>
  }

  <span class="spacer"></span>

  @if (isLoggedIn()) {
    <button matButton [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
      {{ fullname() }}
    </button>
    <mat-menu #userMenu="matMenu">
      @if (isFarmer()) {
        <a mat-menu-item routerLink="/profile">
          <mat-icon>person</mat-icon>
          <span>Το προφίλ μου</span>
        </a>
      }
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Αποσύνδεση</span>
      </button>
    </mat-menu>
  } @else {
    <a matButton="outlined" routerLink="/login">Σύνδεση</a>
  }
</mat-toolbar>
